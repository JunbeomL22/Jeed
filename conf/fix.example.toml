# conf/fix.toml 템플릿. 이 파일을 fix.toml 로 복사해서 채운다.
#
# [[feed]] 하나 = FIX 세션 하나 = 수신 스레드 하나 = 링 하나. KRX·크립토와 같은 배선이고,
# 다른 건 세션(로그온·하트비트·리센드)과 베뉴 어댑터다.
#
# **베뉴 어댑터는 conf 가 몬다.** jeed-fix 는 FIX 만 알고 베뉴는 모른다(feed_handler.md §13).
# 디코드된 35=W/35=X 를 WireRecord 로 바꾸는 마지막 한 걸음이 어댑터인데, 이 바이너리는
# 그 자리에 `SnapshotAdapter` 를 끼운다. 아래 값들이 어댑터를 몬다:
#
#   - venue          : 와이어 베뉴 바이트 (지금은 smbs 하나)
#   - price/qty_decimals : FIX 는 정밀도를 안 실으므로 세션 전체를 이 스케일로 파싱한다
#   - symbols        : 요청하고 받을 종목
#
# 어댑터가 하는 일: 35=W(전체 스냅샷) → Quote, 35=X 의 체결 → Trade. **거절하는 것**:
# 북을 움직이는 35=X(와이어에 델타 레코드가 아직 없다), 크기 없는 스냅샷 레벨(default_qty 미설정).
# 거절은 리포트의 `fail`/`refused` 로 세지 틀린 북으로 싣지 않는다. SMBS 고유의 관행
# (35=X 를 어떻게 보내는지, 크기 없음이 무슨 뜻인지)은 실접속으로 확인되는 날 어댑터를
# 그 베뉴 옆에서 특수화한다.
#
# 아무것도 만들지 않고 검증만: `jeed-fix conf/fix.toml --check`
# 코어 핀 없이(개발 기계):    `jeed-fix conf/fix.toml --no-pin`
# 경로는 실행 디렉터리 기준이다 — 저장소 루트에서 띄운다.

# ─────────────────────────────────────────────────────────────────────────────
# SMBS (서울외국환중개) FX. 값은 회선 배정표·계정에서 채운다.
# ─────────────────────────────────────────────────────────────────────────────
[[feed]]
name  = "smbs"
venue = "smbs"
mode  = "block"          # 시장데이터 세션은 초당 수 건이라 block 이 기본
cores = [4]
ring  = "jeed.fix.smbs"
ring_slots = 16384      # 슬롯 하나 640B → 10 MiB. 2의 거듭제곱이어야 한다.
                        # 링은 한 CCD 의 L3(32 MiB)를 넘지 않는다 — 넘으면 매 슬롯이
                        # DRAM RFO 가 되고 소비자의 북을 L3 밖으로 밀어낸다

host = "10.0.0.1"        # 회선 배정표
port = 9100
sender_comp_id = "JEED"  # 우리 (49)
target_comp_id = "SMBS"  # 상대 (56)

price_decimals = 2       # USD/KRW 는 소수 둘째 자리 (1332.50)
qty_decimals   = 0

symbols = ["USD/KRW", "EUR/KRW"]   # 요청·수신할 종목 (거래소 표기 그대로)

# begin_string = "FIX.4.4"   # 로그온의 8= 값 (다른 버전이면 바꾼다)
# heartbeat_secs = 30        # 108. 0 이면 세션 생존 신호가 꺼진다
# reset_seq = true           # 141=Y — 재접속에 시퀀스를 이어받지 않는다 (북을 안 들고 있으니까)
# depth = 0                  # 264. 0 은 전체 북, 1 은 최우선호가
# subscription = "updates"   # "updates"(스냅샷+갱신) 또는 "snapshot"(한 번)
# default_qty = 0            # 크기 없는 스냅샷 레벨에 쓸 값. 없으면 그런 레벨은 거절
# reconnect_secs = 5         # 재접속 간격 (지수 백오프 아님)
# logon_timeout_secs = 10    # 로그온 응답 대기
# burst = 64                 # 한 라운드에 처리하는 메시지 수

# ─────────────────────────────────────────────────────────────────────────────
# 장애 감지 (feed_handler.md §9). KRX·크립토와 같다 — 없으면 켜진 값, 끄려면 0.
# ─────────────────────────────────────────────────────────────────────────────
[health]
heartbeat_ms = 100
stale_ms = 500

[log]
report_secs = 10
