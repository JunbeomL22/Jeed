# conf/krx.toml 템플릿. 이 파일을 krx.toml 로 복사해서 채운다.
#
# **IP·포트는 비워 뒀다.** 표준서의 그룹IP/운용포트는 표준 배정이고 실제 회선
# (증권A / 파생A / 파생B, 100M / 12M)에 따라 다르다. 생성기가 만들어내면 틀린 값이
# 조용히 박히므로, 여기만은 사람이 회선 배정표를 보고 적는다.
#
# 기동 시 검증되는 것:
#   - `trcodes` 의 각 코드가 conf/krx_trcodes.toml 의 [code] 에 있는가 (없으면 기동 실패)
#   - `cores` 가 서로 겹치지 않는가, hot 코어의 SMT 형제를 cold 가 쓰지 않는가
# 검증되지 **않는** 것:
#   - 소켓 ↔ trcode 대응. 어느 포트에 뭐가 실리는지는 회선 배정이라 우리가 모른다.
#     대신 런타임에 "이 소켓에서 한 번도 안 본 trcode" 카운터를 노출해서 오배선이 보이게 한다.

trcode_table = "conf/krx_trcodes.toml"

# ─────────────────────────────────────────────────────────────────────────────
# hot — busy-spin, 코어 핀 필수
#
# 한 포트에 데이터구분이 여럿 실려 온다(B6 G7 A3 V1 Q2 A7 O6 …). 소켓으로 hot/cold 를
# 나눌 수 없으므로 `sockets` 와 `trcodes` 가 따로다: 가입할 곳과 건질 것이 다르다.
# ─────────────────────────────────────────────────────────────────────────────
[[feed]]
name  = "hot"
mode  = "spin"          # 논블로킹 소켓을 도는 busy-spin. 코어 100%
cores = [2]             # 핀 코어 1개 = 수신 스레드 1개 = producer 1개 = 링 1개.
                        # SMT 형제(7700 기준 10)는 비워 둔다
ring  = "jeed.krx.hot"
ring_slots = 65536      # 슬롯 하나 576B → 약 36MB. 2의 거듭제곱이어야 한다

sockets = [
  # "233.xxx.xxx.92:10302",   # 코스피200 선물
  # "233.xxx.xxx.96:10322",   # 코스피200 콜옵션
  # "233.xxx.xxx.97:10323",   # 코스피200 풋옵션
]

# 이 소켓들에서 건질 것만 적는다. 나머지는 수신 루프에서 버린다.
# V1·Q2 는 초당 수 건이라 "cold 성격" 이지만 hot 소켓으로 들어오므로 hot 링에 같이 싣는다
# (같은 소켓을 두 링으로 나누면 hot 스레드가 producer 를 둘 갖게 된다). 분류는 소비자가 kind 로.
trcodes = [
  "B601F", "G701F",     # 코스피200선물   우선호가 5단 / 체결+호가 5단
  "B603F", "G703F",     # KOSPI200옵션
  "V101F", "V103F",     # 가격제한폭 확대 발동
  "Q201F", "Q203F",     # 동적상하한가 적용·해제
]

# ─────────────────────────────────────────────────────────────────────────────
# cold — WSAPoll 블로킹. 다른 포트로만 오는 것들
#
# 핀을 한다. Windows 에는 isolcpus 가 없어서 hot 코어를 비워 둘 강제 수단이 없으므로,
# hot 코어와 그 SMT 형제만 빼고 핀해서 회피한다.
# ─────────────────────────────────────────────────────────────────────────────
[[feed]]
name  = "cold"
mode  = "block"
cores = [4, 5, 6, 7]    # hot(2)·형제(10) 제외
ring  = "jeed.krx.cold"
ring_slots = 4096

sockets = [
  # "233.xxx.xxx.93:10315",   # 파생 장운영·종목정보
  # "233.xxx.xxx.91:10301",
]

trcodes = [
  "M401F", "M403F",     # 장운영스케줄공개
  "A001F", "A003F",     # 파생 종목정보 (마스터)
]

# ─────────────────────────────────────────────────────────────────────────────
# 종목 필터. 상품군 포트에는 그 상품군 전 종목(옵션이면 전 행사가)이 실린다.
# 비워 두면 전 종목을 통과시킨다.
# ─────────────────────────────────────────────────────────────────────────────
[filter]
# isin = "conf/isin_allow.txt"

# ─────────────────────────────────────────────────────────────────────────────
# 장애 감지 (feed_handler.md §9)
#
# **stale 문턱 기본값을 꺼짐으로 두지 않는다.** conf 에 없으면 보수적인 값이 들어가고,
# 끄려면 명시적으로 0 을 적게 한다 — 이미 한 번 난 사고다.
# ─────────────────────────────────────────────────────────────────────────────
[health]
heartbeat_ms = 100      # 수신 루프 안에서 찍는다. 별도 watchdog 스레드는 감시가 아니라 위장이다
stale_ms = 500          # recv_ns - venue_ns 가 이걸 넘으면 STALE 플래그
