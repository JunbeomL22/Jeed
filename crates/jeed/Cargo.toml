[package]
name = "jeed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The feed-handler binaries: conf, core pinning, segment creation, and the receive threads"

# One crate, one binary per feed. The wiring — conf loading, core pinning,
# segment creation, signal handling, the report line — is the same for every
# feed (`documents/todo.md` §2), so it lives in the library half and each
# `[[bin]]` is the few dozen lines that differ.
#
# This is the only crate that depends on `jeed-shm` *and* a handler: the
# handlers write into a `RecordSink` they do not own, and it is here that the
# sink becomes a ring.

[[bin]]
name = "jeed-krx"
path = "src/bin/krx.rs"
# The documentation lives in the library half; the binary's would land in the
# same `doc/jeed_krx/` directory as the `jeed-krx` handler crate's.
doc = false

[[bin]]
name = "jeed-crypto"
path = "src/bin/crypto.rs"
doc = false

[dependencies]
jeed-wire = { path = "../jeed-wire" }
jeed-shm = { path = "../jeed-shm" }
jeed-krx = { path = "../jeed-krx" }
# With `recv` (the default): the WebSocket loop, TLS, the venue routers and
# the one-request HTTP client the crypto binary uses for start books.
jeed-crypto = { path = "../jeed-crypto" }

# No TOML crate. `toml` brings `serde` and a dozen transitive packages for two
# configuration files whose grammar is tables, arrays of tables, inline
# tables, strings, integers and booleans — `src/toml/` reads that subset in a
# few hundred lines, on the cold path, and the workspace keeps `rustls` as its
# one external dependency.
