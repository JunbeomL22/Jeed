[package]
name = "jeed-krx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "KRX UDP multicast reception and message decoding into jeed-wire records"

[dependencies]
# **No `jeed-shm`.** The decoders write into a `&mut WireRecord` the caller owns,
# so they run against a `Vec<WireRecord>` in tests and a ring slot in the binary.
# A decoder bug must not be able to reach the segment.
jeed-wire = { path = "../jeed-wire" }
